name: dataproof

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: dataproof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: DataProof
        id: dataproof
        uses: s2002kumar/DataProof@5033311267b57644a43f75afab4430cc77983ad4 # main after DataProof#93 (step variables); no tag yet
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: dataproof-report
          path: dataproof-report
